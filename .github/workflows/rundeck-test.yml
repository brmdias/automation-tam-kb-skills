name: Rundeck Test Workflow

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Test message from Rundeck'
        required: false
        default: 'Hello from Rundeck'

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run test script
        run: |
          echo "Received input: ${{ github.event.inputs.message }}"
          echo "Simulating a script execution..."
          date
